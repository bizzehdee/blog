<!--
function read_matrix() {
  var ar = new Array();
  
  for(var y=0; y<9; y++) {
    ar[y] = new Array();
    for(var x=0; x<9; x++) {
      var box = $('#box_' + (y+1) + '_' + (x+1));
      ar[y][x] = box.val() != '' ? box.val() : 0;
    }
  }
  
  return ar;
}

function deep_copy(orig) {
  var ar = new Array();
  
  for(var y=0; y<9; y++) {
    ar[y] = new Array();
    for(var x=0; x<9; x++) {
      ar[y][x] = orig[y][x];
    }
  }
  
  return ar;
}

function permissable(matrix, y, x) {
  var m_ok = new Array(true, true, true, true, true, true, true, true, true);
  
  for(var i=0; i<9; i++) {
    if(matrix[i][x] == 0) continue;
    
    m_ok[matrix[i][x]-1] = false;
  }
  
  for(var i=0; i<9; i++) {
    if(matrix[y][i] == 0) continue;
    
    m_ok[matrix[y][i]-1] = false;
  }
  
  var iy = ((Math.floor(y/3))*3);
  var ix = ((Math.floor(x/3))*3);
  
  for(var _y=iy; _y<iy+3; _y++) {
    for(var _x=ix; _x<ix+3; _x++) {
      //alert("checking " + _y + " " + _x);
      if(matrix[_y][_x] == 0) continue;
      
      m_ok[matrix[_y][_x]-1] = false;
    }  
  }
  
  //alert(m_ok);
  var ret = new Array();
  for(var i=0; i<9; i++) {
    if(m_ok[i]) ret.push(i+1);
  }
  
  return ret;
}

function solve(matrix) {
  while(true) {
    var m_opts = new Array();
    
    for(var y=0; y<9; y++) {
      for(var x=0; x<9; x++) {
        if(matrix[y][x] != 0) continue;
        
        var p = permissable(matrix, y, x);
        if(p.length == 0) {
          //alert("Noope");
          return false;
        }
        
        m_opts.push(new Array(y,x,p));
      }
    }
    
    if(m_opts.length == 0) {
      return matrix;
    }
    
    var m_opt = m_opts[0];
    for(var i=0; i<m_opts.length; i++) {
      if(m_opts[i][2].length < m_opt[2].length) m_opt = m_opts[i];
    }
    
    //if we only have 1 option, we have the solution for this square
    if(m_opt[2].length == 1) {
      matrix[m_opt[0]][m_opt[1]] = m_opt[2];
      continue;
    }
    
    for(var i=0; i<m_opt[2].length; i++) {
      var dc = deep_copy(matrix);
      dc[m_opt[0]][m_opt[1]] = m_opt[2][i];
      
      var r = solve(dc);
      
      if(r != false) {
        return r;
      }
    }
    
    return false;
  }
}

$(function() {
  $('input:text[value=""]').css({color: 'red'});
  $('#solve').click(function() {
    var m = solve(read_matrix());
    
    for(var y=0; y<9; y++) {
      for(var x=0; x<9; x++) {
        $('#box_' + (y+1) + '_' + (x+1)).val(m[y][x]);
      }
    }
  });
});
//-->
</script>
